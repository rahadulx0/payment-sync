name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are tagged with the git SHA so a rollback is an unambiguous retag.
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/paysync-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/paysync-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/paysync-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/paysync-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        envs: IMAGE_TAG
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd /opt/paysync

            PREVIOUS_TAG="$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2 || echo latest)"
            echo "previous=${PREVIOUS_TAG} new=${IMAGE_TAG}"

            # Cheap insurance: a pre-deploy dump whenever a migration is pending.
            if docker compose run --rm api-1 npx prisma migrate status 2>&1 | grep -q "not yet been applied"; then
              echo "migration pending → taking a pre-deploy backup"
              bash /opt/paysync/infra/backup/pg_backup.sh
            fi

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose pull

            # Migrations run as a one-shot BEFORE the app rollout. A failure here
            # aborts the deploy with the previous version still serving.
            if ! docker compose run --rm api-1 npx prisma migrate deploy; then
              echo "::error::migration failed — aborting, previous version stays up"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_TAG}/" .env
              exit 1
            fi

            # Rolling restart: one replica at a time so Caddy always has a healthy
            # upstream to drain to (zero failed requests during a deploy).
            for svc in api-1 api-2; do
              docker compose up -d --no-deps "$svc"
              for i in $(seq 1 30); do
                if docker compose exec -T "$svc" node -e "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                  echo "$svc healthy"; break
                fi
                if [ "$i" = "30" ]; then
                  echo "::error::$svc failed its health gate — rolling back"
                  sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_TAG}/" .env
                  docker compose up -d
                  exit 1
                fi
                sleep 5
              done
            done

            docker compose up -d --no-deps worker admin
            docker image prune -f
            echo "deployed ${IMAGE_TAG}"

      - name: Smoke test
        run: |
          set -e
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.API_DOMAIN }}/api/v1/healthz" > /dev/null; then
              echo "smoke ok"; exit 0
            fi
            sleep 5
          done
          echo "::error::smoke test failed after deploy"
          exit 1
