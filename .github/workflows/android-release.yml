name: android-release

on:
  push:
    tags: ['android-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # The parser artifacts the APK ships must match packages/parsers exactly.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export parser artifacts
        run: pnpm --filter @paysync/parsers export:android
        working-directory: .
      - name: Fail on parser drift
        run: git diff --exit-code apps/android/app/src/main/assets apps/android/app/src/test/resources

      - name: Unit tests (incl. parser-parity gate)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Signing comes from CI secrets. The build fails loudly without them rather
      # than silently falling back to a debug key.
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"

      # latest.json is the manifest the in-app updater reads — it replaces the
      # Play Store listing (Google Play cannot distribute this app, §17.1).
      - name: Generate latest.json
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          cat > latest.json <<EOF
          {
            "version_code": ${GITHUB_RUN_NUMBER},
            "version_name": "${VERSION_NAME}",
            "apk_url": "https://downloads.example.com/payment-sync-${VERSION_NAME}.apk",
            "sha256": "${SHA}",
            "size": ${SIZE},
            "release_notes_en": "See the release notes on GitHub.",
            "release_notes_bn": "রিলিজ নোট গিটহাবে দেখুন।",
            "min_android_sdk": 26,
            "mandatory": false
          }
          EOF
          cat latest.json

      # mapping.txt is required to deobfuscate any future crash report.
      - name: Archive mapping and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/latest.json
          retention-days: 90
