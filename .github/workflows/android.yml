name: android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/parsers/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Keep the app's parser rules + fixtures byte-identical to packages/parsers.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export parser artifacts
        run: pnpm --filter @paysync/parsers export:android
        working-directory: .
      - name: Fail on drift
        run: git diff --exit-code apps/android/app/src/main/assets apps/android/app/src/test/resources

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # Unit tests include the release-blocking parser-parity + hash + allowlist gates.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

  # Instrumented tests (SmsReceiver, Room migration, enroll flow) run on an emulator.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
